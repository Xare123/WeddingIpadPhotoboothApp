name: Local verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedding-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'Xare123/WeddingIpadPhotoboothApp' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      WRANGLER_SEND_METRICS: 'false'
      XDG_CONFIG_HOME: /tmp/wedding-ci-config
      WRANGLER_LOG_PATH: /tmp/wedding-ci-wrangler.log
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify native CI and physical preparation guards
        run: node --test scripts/ci-native.test.mjs scripts/native-camera-capability.test.mjs scripts/ci-native-pixels.test.mjs scripts/ci-native-pixels-results.test.mjs scripts/prepare-ios-physical-tests.test.mjs scripts/collect-ios-startup-diagnostics.test.mjs
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, test and bundle iOS JavaScript
        shell: bash
        run: npm run check 2>&1 | tee /tmp/wedding-check.log
      - name: Reproduce independently reviewed recovery faults
        run: node --import tsx --test tools/acceptance/recovery-faults.test.ts
      - name: Exercise local HTTP workflow
        shell: bash
        run: |
          setsid npm run dev:api > /tmp/wedding-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            result=$?
            trap - EXIT
            kill -TERM -- "-$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8787/health > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke
      - name: Retain bounded redacted diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wedding-diagnostics"
          node --version > "$RUNNER_TEMP/wedding-diagnostics/toolchain.txt"
          npm --version >> "$RUNNER_TEMP/wedding-diagnostics/toolchain.txt"
          for source in /tmp/wedding-check.log /tmp/wedding-api.log; do
            if test -f "$source"; then
              tail -n 400 "$source" | sed -E 's@/g/[a-f0-9]{64}@/g/[redacted]@g' > "$RUNNER_TEMP/wedding-diagnostics/$(basename "$source")"
            fi
          done
          rm -f /tmp/wedding-check.log /tmp/wedding-api.log /tmp/wedding-ci-wrangler.log
      - name: Publish useful diagnostics in the public job summary
        if: always()
        env:
          WEDDING_DIAGNOSTICS_DIR: ${{ runner.temp }}/wedding-diagnostics
          WEDDING_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-summary.mjs linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-verification-diagnostics
          path: ${{ runner.temp }}/wedding-diagnostics
          if-no-files-found: ignore
          retention-days: 7
