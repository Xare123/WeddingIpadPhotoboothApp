name: Unsigned synthetic Vision probe compile

on:
  push:
    branches:
      - codex/post-capture-face-effects

permissions:
  contents: read

concurrency:
  group: wedding-vision-probe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: >-
      github.repository == 'Xare123/WeddingIpadPhotoboothApp' &&
      github.event.repository.private == false &&
      contains(github.event.head_commit.message, '[native-vision-probe-build-ci]')
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Check unsigned build and NOT_ARMED artifact guards
        timeout-minutes: 3
        run: node --test scripts/ci-build-ios-vision-probe.test.mjs
      - name: Compile only for generic physical SDK with signing disabled
        timeout-minutes: 22
        run: node scripts/ci-build-ios-vision-probe.mjs
      - name: Publish compile-only evidence summary
        if: always()
        run: |
          node --input-type=module - <<'JS'
          import {appendFileSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          let status;
          try { status=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'wedding-vision-probe-build-diagnostics/status.json'),'utf8')); } catch {}
          const rows=['## Unsigned synthetic Vision probe compile','',
            'Commit: `'+process.env.GITHUB_SHA+'`',
            'Result: **'+(status?.result??'no status produced')+'**',
            'Build completed: **'+(status?.buildComplete===true)+'**',
            'Built NOT_ARMED artifact and PNG verified: **'+(status?.builtArtifact?.fixtureVerified===true)+'**',
            'Owned process cleanup verified: **'+(status?.processCleanup?.allOwnedGroupsQuiescent===true)+'**','',
            '**Build-for-testing only. Zero XCTest executions. No device discovery, signing, provisioning, installation, launch or runtime Vision proof.**',
            'Only fixed fictional CI identity, bounded redacted logs and source/artifact provenance are uploaded. No runner app or raw xctestrun is published.'];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join('\n')+'\n');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unsigned-vision-probe-compile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wedding-vision-probe-build-diagnostics/status.json
            ${{ runner.temp }}/wedding-vision-probe-build-diagnostics/provenance.json
            ${{ runner.temp }}/wedding-vision-probe-build-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 3
